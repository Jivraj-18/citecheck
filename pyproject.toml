[project]
name = "citecheck"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jivraj-18", email = "jivrajsinghs123@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "httpx>=0.28.1",
    "openai>=3.24.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
]

[project.scripts]
